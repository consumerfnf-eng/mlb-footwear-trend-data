<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>MLB Footwear Trend Dashboard</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1c1c; --sub: #6b6b6b; --line: #e4e2dd;
    --chunky: #f6d9c9; --chunky-ink: #9a4a1f;
    --street: #dfe6ea; --street-ink: #33505f;
    --sportive: #e1e8dc; --sportive-ink: #43592f;
    --feminine: #f3dde6; --feminine-ink: #8a3f5c;
    --wellness: #dce8e6; --wellness-ink: #2f5c53;
    --summer: #fdf1d8; --summer-ink: #8a6417;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Pretendard","Apple SD Gothic Neo",sans-serif; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:13px; margin-bottom:20px; }
  .statgrid { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .stat-card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 18px; min-width:120px; }
  .stat-card .label { font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:0.03em; }
  .stat-card .value { font-size:22px; font-weight:700; margin-top:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .brand { font-size:11px; color:var(--sub); }
  .name { font-size:14px; font-weight:700; margin:2px 0 8px; }
  .name .code { font-weight:400; color:var(--sub); font-size:11px; }
  .pill-row { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .pill { font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--bg); }
  .pill.line-CHUNKY { background:var(--chunky); color:var(--chunky-ink); }
  .pill.line-RUNNER { background:var(--sportive); color:var(--sportive-ink); }
  .pill.line-LINER { background:var(--street); color:var(--street-ink); }
  .pill.line-SNEAKERS { background:var(--street); color:var(--street-ink); }
  .pill.line-OUTDOOR { background:var(--sportive); color:var(--sportive-ink); }
  .pill.line-SUMMER { background:var(--summer); color:var(--summer-ink); }
  .pill.life-PREMIUM { background:var(--sportive); color:var(--sportive-ink); }
  .pill.life-STREET { background:var(--street); color:var(--street-ink); }
  .pill.life-FEMININE { background:var(--feminine); color:var(--feminine-ink); }
  .pill.life-WELLNESS { background:var(--wellness); color:var(--wellness-ink); }
  .pill.sub { background:var(--bg); color:var(--sub); border:1px solid var(--line); }
  .imgrow { display:flex; gap:6px; margin-bottom:10px; }
  .imgrow img { width:56px; height:56px; object-fit:cover; border-radius:6px; border:1px solid var(--line); background:var(--bg); }
  .kv { display:grid; grid-template-columns:60px 1fr; gap:2px 8px; font-size:11.5px; margin-bottom:3px; }
  .kv .k { color:var(--sub); }
  .kv .v { color:var(--ink); }
  .status-line { margin-top:8px; font-size:11px; color:var(--sportive-ink); }
  .filter-row { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  select { border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:12px; background:var(--panel); }
  #loadMsg { font-size:13px; color:var(--sub); padding:20px 0; }
  #reloadBtn { border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; }
</style>
</head>
<body>

<h1>MLB Footwear Trend Dashboard</h1>
<div class="sub">data/mlb_footwear_items.json 실시간 연동 · GitHub 저장소 데이터 갱신하면 새로고침 시 자동 반영</div>

<div id="loadMsg">데이터 불러오는 중...</div>
<div id="dashboardBody" style="display:none;">
  <div class="statgrid" id="stats"></div>
  <div class="filter-row">
    <select id="lineFilter"><option value="">전체 mlb_line</option></select>
    <select id="lifeFilter"><option value="">전체 lifestyle</option></select>
    <button id="reloadBtn">새로고침</button>
  </div>
  <div class="grid" id="cardGrid"></div>
</div>

<script>
// 저장소 안 data/mlb_footwear_items.json을 직접 fetch합니다.
// GitHub Pages로 배포된 경우 상대경로 fetch만으로 동작합니다.
// (로컬에서 파일을 그냥 더블클릭해서 열면 file:// 프로토콜이라 fetch가 막히니,
//  반드시 GitHub Pages 배포된 주소로 접속해서 확인해주세요.)
const DATA_URL = './data/mlb_footwear_items.json';

let DATA = [];

function lineClass(line) {
  if (!line) return '';
  if (line.startsWith('SUMMER')) return 'line-SUMMER';
  return 'line-' + line;
}
function lifeClass(life) {
  if (!life) return '';
  if (life.startsWith('PREMIUM')) return 'life-PREMIUM';
  return 'life-' + life;
}

function renderStats(data) {
  const total = data.length;
  const avgConf = total ? (data.reduce((s,d)=>s+(d.classification_confidence||0),0)/total).toFixed(2) : '-';
  const lineCounts = {};
  data.forEach(d => lineCounts[d.mlb_line] = (lineCounts[d.mlb_line]||0)+1);
  const sorted = Object.entries(lineCounts).sort((a,b)=>b[1]-a[1]);
  const topLine = sorted[0] || ['-', 0];
  const confirmed = data.filter(d=>d.review_status==='AI_CONFIRMED').length;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="label">총 건수</div><div class="value">${total}</div></div>
    <div class="stat-card"><div class="label">평균 confidence</div><div class="value">${avgConf}</div></div>
    <div class="stat-card"><div class="label">최다 mlb_line</div><div class="value" style="font-size:16px;">${topLine[0]} (${topLine[1]})</div></div>
    <div class="stat-card"><div class="label">AI_CONFIRMED</div><div class="value">${confirmed}/${total}</div></div>
  `;
}

function renderCards(data) {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = data.map(d => `
    <div class="card">
      <div class="brand">${d.brand||''}</div>
      <div class="name">${d.product_name||'-'} <span class="code">${d.product_code||''}</span></div>
      <div class="pill-row">
        <span class="pill ${lineClass(d.mlb_line)}">${d.mlb_line||'-'}</span>
        <span class="pill sub">${d.mlb_subcategory||'-'}</span>
        <span class="pill ${lifeClass(d.primary_lifestyle)}">${d.primary_lifestyle||'-'}</span>
        ${d.secondary_lifestyle ? `<span class="pill sub">${d.secondary_lifestyle}</span>` : ''}
      </div>
      <div class="imgrow">
        ${d.img_front ? `<img src="${d.img_front}" onerror="this.style.display='none'">` : ''}
        ${d.img_side ? `<img src="${d.img_side}" onerror="this.style.display='none'">` : ''}
      </div>
      <div class="kv"><div class="k">구조</div><div class="v">${d.form_structure_note||'-'}</div></div>
      <div class="kv"><div class="k">솔</div><div class="v">높이 ${d.sole_height_level??'-'}·조각 ${d.sole_sculpture_level??'-'}·지배 ${d.sole_dominance===true?'○':'✕'}</div></div>
      <div class="kv"><div class="k">소재</div><div class="v">${d.upper_material_primary||'-'}${d.material_mix?' · 믹스 ○':''}</div></div>
      <div class="kv"><div class="k">기능</div><div class="v">${d.function_note||'-'}</div></div>
      <div class="status-line">confidence ${d.classification_confidence??'-'} · ${d.review_status||'-'}</div>
    </div>
  `).join('');
}

function populateFilters(data) {
  const lineSel = document.getElementById('lineFilter');
  const lifeSel = document.getElementById('lifeFilter');
  lineSel.innerHTML = '<option value="">전체 mlb_line</option>';
  lifeSel.innerHTML = '<option value="">전체 lifestyle</option>';
  [...new Set(data.map(d=>d.mlb_line).filter(Boolean))].forEach(l => lineSel.innerHTML += `<option value="${l}">${l}</option>`);
  [...new Set(data.map(d=>d.primary_lifestyle).filter(Boolean))].forEach(l => lifeSel.innerHTML += `<option value="${l}">${l}</option>`);

  function applyFilter() {
    const lv = lineSel.value, lf = lifeSel.value;
    const filtered = DATA.filter(d => (!lv || d.mlb_line===lv) && (!lf || d.primary_lifestyle===lf));
    renderCards(filtered);
  }
  lineSel.onchange = applyFilter;
  lifeSel.onchange = applyFilter;
}

async function loadData() {
  document.getElementById('loadMsg').style.display = 'block';
  document.getElementById('dashboardBody').style.display = 'none';
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    DATA = payload.items || [];
    document.getElementById('loadMsg').style.display = 'none';
    document.getElementById('dashboardBody').style.display = 'block';
    renderStats(DATA);
    renderCards(DATA);
    populateFilters(DATA);
  } catch (e) {
    document.getElementById('loadMsg').textContent = '데이터를 불러오지 못했습니다: ' + e.message + ' (GitHub Pages로 배포된 주소에서 열어야 fetch가 동작합니다)';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadData();
  document.getElementById('reloadBtn')?.addEventListener('click', loadData);
});
if (document.readyState !== 'loading') loadData();
</script>
</body>
</html>
